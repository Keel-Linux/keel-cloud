# The tests of the keel_cloud package, with the coverage gate of 95
# percent (pyproject.toml, fail_under; raise only). The check is
# "coverage / trixie".
#
# Everything comes from Debian 13: the service's aiohttp, pytest and its
# aiohttp and coverage plugins, and openssl for the tests' certificate.
# Nothing is installed from PyPI. A test that cannot run fails rather than
# skips (pyproject.toml, filterwarnings).
#
# The job runs in a Debian trixie system container, an unprivileged LXC
# container on the self-hosted runner, through the reusable workflow
# lxc-trixie.yml of Keel-Linux/.github. Keel runs no application
# containers in CI. A pull request from a fork never reaches the
# self-hosted runner.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  coverage:
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      timeout: 15
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates openssl python3 python3-aiohttp python3-yaml \
          python3-pytest python3-pytest-aiohttp python3-pytest-cov
        python3 -m pytest -q --cov --cov-report=term-missing
