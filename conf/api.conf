# Keel Cloud API service, read by keel-cloud-api and keel-cloud.
# TLS only: there is no plain HTTP listener. The certificate the package
# made at installation is self-signed, for development; see README.md,
# "TLS", for a certificate from ACME.
[api]
listen = ::
port = 8443
certificate = /etc/keel-cloud/tls/cert.pem
private_key = /etc/keel-cloud/tls/key.pem
database = /var/lib/keel-cloud/cloud.db
# How often a long poll looks for a change, in seconds.
poll_interval = 1
